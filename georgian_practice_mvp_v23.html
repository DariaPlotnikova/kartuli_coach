<style>

.tabs{position:relative}

button{-webkit-tap-highlight-color:transparent}
.topicChip,.countBtn,.countPreset,.tab,.nav{user-select:none;-webkit-user-select:none}
.practiceMain{flex:1;min-width:0}

.tabs{display:grid;grid-template-columns:1fr 1fr;position:relative;border-bottom:1px solid var(--line);margin:20px 0 18px}
.tabs .tab{appearance:none;-webkit-appearance:none;border:0!important;background:transparent!important;border-radius:0!important;
  padding:11px 8px 12px;color:var(--muted);font-size:16px;font-weight:400;box-shadow:none;outline:none}

.topicCloud{gap:7px;margin:9px 0 27px}

/* Quantity: one soft control, inspired by a mobile stepper */
.quantityPanel{background:var(--accent2);border:1px solid color-mix(in srgb,var(--accent) 18%,var(--line));

.app.screen-enter-forward{animation:screenInForward 260ms cubic-bezier(.2,.8,.2,1)}

 .app.screen-enter-forward,.app.screen-enter-back,.app.screen-enter-fade{animation:none}
 .feedTrack.animating,.tabIndicator.animating{transition:none}
}

let state={screen:"feed",tab:"feed",selected:[],current:null,pos:0,answers:[],review:false,reviews:{},count:6,profileName:"Даша",profileGroup:"нашей группой",profileEditing:false,discussions:{},compareRevealed:{},discussionOpen:{}};
const $=s=>document.querySelector(s);
function norm(v){
 return String(v??"").trim().replace(/\s+/g," ").toLocaleLowerCase();
}
function setScreen(s){
 const complete=!!(state.profileName&&state.profileName.trim()&&state.profileGroup&&state.profileGroup.trim());
 if(!complete && s!=="profile")return;
 const prev=state.screen;
 state.screen=s;render();scrollTo(0,0);
 const a=$("#app");
 if(!a)return;
 const back=(s==="feed" && prev!=="feed");
 const fade=(prev==="feed" && ["profile"].includes(s)) || (s==="profile" && prev!=="profile");
 const cls=fade?"screen-enter-fade":back?"screen-enter-back":"screen-enter-forward";
 a.classList.remove("screen-enter-forward","screen-enter-back","screen-enter-fade");
 void a.offsetWidth;
 a.classList.add(cls);
 setTimeout(()=>a.classList.remove(cls),280);
}
function theme(){document.body.classList.toggle("dark");sessionStorage.theme=document.body.classList.contains("dark")?"dark":"light"}
if(sessionStorage.theme==="dark")document.body.classList.add("dark");
function header(title="",back=false){return `<header>${back?`<button type="button" class="back" data-screen="feed" onclick="setScreen('feed')" aria-label="Назад">${icons.back}</button>`:`<div class="logo">ქართული</div>`}<div style="flex:1">${title?`<b style="font-weight:600">${title}</b>`:""}</div><button type="button" class="iconbtn" onclick="theme()" aria-label="Сменить тему">${document.body.classList.contains("dark")?icons.moon:icons.sun}</button></header>`}
function bottom(active){$("#bottom").innerHTML=[["feed",icons.home,"Лента"],["create",icons.plus,"Создать"],["profile",icons.user,"Профиль"]].map(x=>`<button type="button" class="nav ${active===x[0]?"active":""}" data-screen="${x[0]}" onclick="setScreen('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join("");$("#bottom").style.display="flex"}

function practiceCards(items){
 if(!items.length)return `<div class="empty">Здесь пока ничего нет.</div>`;
 return items.map(p=>{
   const people=p.participants||[];
   const shown=people.slice(0,3);
   const extra=Math.max(0,people.length-3);
   const topics=(p.topics||[]).slice(0,2);
   const age=p.age?` · ${p.age}`:"";
   return `<button type="button" class="practice practiceCardButton" onclick="openPractice(${p.id},${p.mine?"false":"true"})">
     <div class="pcTitle">${p.title}</div>
     <div class="pcMeta">${p.author} · ${p.ids.length} заданий${age}</div>
     <div class="pcTopics">${topics.map(t=>`<span class="pcTopic">${t}</span>`).join("")}</div>
     <div class="pcSocial">
       <div class="pcAvatars">${shown.map(n=>`<span class="pcAvatar" title="${n}">${n.slice(0,1)}</span>`).join("")}${extra?`<span class="pcMore">+${extra}</span>`:""}</div>
       <span class="pcPassed">${people.length?`${people.length} прошли`:"Пока никто не прошёл"}</span>
     </div>
   </button>`;
 }).join("");
}
function feed(){
 const group=practices.filter(p=>!p.mine), mine=practices.filter(p=>p.mine);
 return `${header("",false)}<h1>Привет, Даша</h1><p class="lead">Немного практики — без оценок и дедлайнов.</p>
 <div class="tabs" id="feedTabs">
   <button type="button" class="tab ${state.tab==="feed"?"active":""}" onclick="switchFeedTab('feed')">Лента</button>
   <button type="button" class="tab ${state.tab==="mine"?"active":""}" onclick="switchFeedTab('mine')">Мои практики</button>
   <div class="tabIndicator" id="tabIndicator" style="transform:translate3d(${state.tab==="mine"?100:0}%,0,0)"></div>
 </div>
 <div class="feedPager" id="feedPager">
   <div class="feedTrack" id="feedTrack" style="transform:translate3d(${state.tab==="mine"?-50:0}%,0,0)">
     <section class="feedPage" data-tab="feed">${practiceCards(group)}</section>
     <section class="feedPage" data-tab="mine">${practiceCards(mine)}</section>
   </div>
 </div>`;
}
function setFeedTab(tab){ state.tab=tab; render(); }

function create(){
 if(!state.selected.length)state.selected=[topics[0],topics[1],topics[2]];
 return `${header("Новая практика",true)}
 <div class="field"><label>Название</label><input id="ptitle" value="${state.selected.slice(0,2).join(" + ")}"></div>

 <div class="sectionLabel">Темы</div><div class="sectionHelp">Выбери одну или несколько</div>
 <div class="topicCloud">${topics.map(t=>`<button type="button" class="topicChip ${state.selected.includes(t)?"selected":""}" data-topic="${t}" onclick="toggleTopicChip(this)"><svg viewBox="0 0 24 24"><path d="m5 12 4 4 10-10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${t}</span></button>`).join("")}</div>

 <div class="sectionLabel">Количество заданий</div>
 <div class="quantityPanel">
   <div class="countControl"><button type="button" class="countBtn" onclick="changeCount(-1)" aria-label="Уменьшить">${icons.minus||"−"}</button><div class="countValue" id="countValue">${state.count}</div><button type="button" class="countBtn" onclick="changeCount(1)" aria-label="Увеличить">${icons.add||"+"}</button></div>
   <div class="countPresets">${[5,8,10,15].map(n=>`<button type="button" class="countPreset ${state.count===n?"selected":""}" onclick="setCount(${n})">${n}</button>`).join("")}</div>
 </div>
 <button type="button" class="primary" id="createPracticeBtn" onclick="generatePractice()" ${state.selected.length?"":"disabled"}>Создать практику</button>`;
}
function toggleTopicChip(el){
 let t=el.dataset.topic,i=state.selected.indexOf(t);
 if(i>=0)state.selected.splice(i,1);else state.selected.push(t);
 el.classList.toggle("selected");
 $("#createPracticeBtn").disabled=!state.selected.length;
}
function updateCountUI(){
 $("#countValue").textContent=state.count;
 document.querySelectorAll(".countPreset").forEach(b=>b.classList.toggle("selected",+b.textContent===state.count));
}
function changeCount(d){state.count=Math.max(1,Math.min(20,state.count+d));updateCountUI()}
function setCount(n){state.count=n;updateCountUI()}
function generatePractice(){
 let pool=bank.filter(x=>state.selected.includes(x.topic)).sort(()=>Math.random()-.5);
 let count=Math.min(state.count||6,pool.length),chosen=pool.slice(0,count);
 let p={id:Date.now(),title:$("#ptitle").value||"Моя практика",author:"Даша",topics:[...state.selected],ids:chosen.map(x=>x.id),answers:[],age:"только что",mine:true};
 practices.unshift(p);openPractice(p.id,false);
}
function openPractice(id,review){
 const p=practices.find(x=>x.id===id);
 if(!p)return;
 state.current=id;
 state.idx=0;
 state.review=!!review;
 state.answers=[];
 state.screen="practice";
 render();
 scrollTo(0,0);
 const a=$("#app");
 if(a){a.classList.add("screen-enter-forward");setTimeout(()=>a.classList.remove("screen-enter-forward"),280)}
}
function ownPractice(){
 const p=practices.find(x=>x.id===state.current);
 if(!p)return `<div class="empty">Практика не найдена.</div>`;
 const ex=bank.find(x=>x.id===p.ids[state.idx]);
 if(!ex)return `<div class="empty">Задание не найдено.</div>`;
 const value=state.answers[state.idx]||"";
 return `${header(p.title,true)}
 <div class="compareProgress"><span>${state.idx+1} / ${p.ids.length}</span><div class="progress"><i style="width:${((state.idx+1)/p.ids.length)*100}%"></i></div></div>
 <div class="compareTopic">${ex.topic}</div>
 <h1 class="question">${ex.q}</h1>
 <div class="compareAnswer"><label>Твой ответ</label>
   <div class="answerInputWrap"><textarea id="ownAnswer" placeholder="Напиши свой вариант…" oninput="state.answers[state.idx]=this.value;updateOwnSaveButton()">${value}</textarea></div>
   <button type="button" class="primary" id="ownSaveBtn" style="margin-top:14px" onclick="saveOwnAnswer()" ${value.trim()?"":"disabled"}>${state.idx===p.ids.length-1?"Завершить":"Сохранить и дальше"}</button>
   <button type="button" class="secondary" style="margin-top:8px" onclick="skipOwnAnswer()">${state.idx===p.ids.length-1?"Завершить без ответа":"Не знаю / пропустить"}</button>
 </div>`;
}
function updateOwnSaveButton(){
 const b=$("#ownSaveBtn"),t=$("#ownAnswer");if(b&&t)b.disabled=!t.value.trim();
}
function saveOwnAnswer(){
 const p=practices.find(x=>x.id===state.current),t=$("#ownAnswer");
 if(!p||!t)return;
 state.answers[state.idx]=t.value.trim();
 if(state.idx<p.ids.length-1){state.idx++;render();scrollTo(0,0)}
 else finishOwnPractice();
}
function skipOwnAnswer(){
 state.answers[state.idx]="";
 const p=practices.find(x=>x.id===state.current);if(!p)return;
 if(state.idx<p.ids.length-1){state.idx++;render();scrollTo(0,0)}
 else finishOwnPractice();
}
function finishOwnPractice(){
 const p=practices.find(x=>x.id===state.current);if(!p)return;
 p.answers=[...state.answers];
 state.screen="result";render();scrollTo(0,0);
}
function practice(){
 if(!state.review)return ownPractice();
 let p=practices.find(x=>x.id===state.current),ex=bank.find(x=>x.id===p.ids[state.idx]);
 let authorAnswer=p.answers[state.idx]||"";
 let key=p.id+"_"+ex.id, revealed=!!state.compareRevealed[key], open=!!state.discussionOpen[key];
 let myAnswer=(state.answers[state.idx]||"");
 let different=revealed && norm(myAnswer)!==norm(authorAnswer);
 let log=state.discussions[key]||[];
 return `${header(p.title,true)}
 <div class="compareProgress"><span>${state.idx+1} / ${p.ids.length}</span><div class="progress"><i style="width:${((state.idx+1)/p.ids.length)*100}%"></i></div></div>
 <div class="compareTopic">${ex.topic}</div>
 <h1 class="question">${ex.q}</h1>

 ${!revealed?`<div class="compareAnswer"><label>Твой ответ</label><div class="answerInputWrap"><textarea id="peerAnswer" placeholder="Напиши свой вариант…" oninput="state.answers[state.idx]=this.value">${myAnswer}</textarea></div><div class="comparePrompt">Ответ ${p.author} увидишь после своего.</div><button type="button" class="primary" id="compareBtn" style="margin-top:14px" onclick="revealComparison('${key}')">Сравнить ответы</button></div>`:
 `<div class="compareReveal">
   <div class="answerStack">
    <div class="answerBox mine"><div class="answerLabel">Ты</div><div class="answerText">${myAnswer}</div></div>
    <div class="answerBox"><div class="answerLabel">${p.author}</div><div class="answerText">${authorAnswer}</div></div>
    <div class="answerBox reference"><div class="answerLabel">Эталонный вариант</div><div class="answerText">${ex.ref}</div></div>
   </div>
   <div class="diffNotice ${different?"":"same"}">
     <span>${different?`У вас разные ответы`:`Ответы совпали`}</span>
     ${different?`<button type="button" class="discussBtn" onclick="toggleDiscussion('${key}')">${open?"Скрыть":"Обсудить"}</button>`:""}
   </div>
   ${different&&open?discussionBlock(key,log):""}
 </div>`}
 ${revealed?`<div class="navRow reviewNav"><button type="button" class="navText" onclick="prevCompare()" ${state.idx===0?"disabled":""}>${icons.back} Назад</button><span>${state.idx+1} из ${p.ids.length}</span><button type="button" class="navText accent" onclick="nextCompare()">${state.idx===p.ids.length-1?"Готово":"Вперёд"} ${state.idx===p.ids.length-1?"":icons.next}</button></div>`:""}`;
}
function discussionBlock(key,log){
 return `<div class="discussion"><div class="discussionTitle">Обсуждение</div><div class="messageLog">${log.length?log.map(m=>`<div class="message"><b>${m.author}</b>${m.text}</div>`).join(""):`<div class="meta">Пока никто ничего не написал.</div>`}</div><div class="messageComposer"><textarea id="discussionText" placeholder="Написать…"></textarea><button type="button" class="sendDiscussion" onclick="appendDiscussion('${key}')" aria-label="Отправить">${icons.send}</button></div></div>`;
}
function revealComparison(key){
 let v=$("#peerAnswer").value.trim();if(!v){$("#peerAnswer").focus();return}
 state.answers[state.idx]=v;state.compareRevealed[key]=true;render();
}
function toggleDiscussion(key){state.discussionOpen[key]=!state.discussionOpen[key];render()}
function appendDiscussion(key){
 let el=$("#discussionText"),text=el.value.trim();if(!text)return;
 (state.discussions[key]||(state.discussions[key]=[])).push({author:state.profileName||"Даша",text});
 state.discussionOpen[key]=true;render();
}
function prevCompare(){if(state.idx>0){state.idx--;render();scrollTo(0,0)}}
function nextCompare(){
 let p=practices.find(x=>x.id===state.current);
 if(state.idx<p.ids.length-1){state.idx++;render();scrollTo(0,0)}
 else setScreen("feed");
}

function result(){
 const p=practices.find(x=>x.id===state.current);
 if(!p)return `<div class="empty">Практика не найдена.</div>`;
 const answered=p.answers.filter(x=>x&&x.trim()).length;
 return `${header("",false)}<div class="result"><div class="bigcheck">✓</div><h1>Практика завершена</h1>
 <div class="sub">Ты прошла ${p.ids.length} заданий. Практика готова для общей ленты.</div>
 <div class="stats"><div class="stat"><b>${answered}</b><small>Ответила</small></div><div class="stat"><b>${p.ids.length-answered}</b><small>Пропустила</small></div></div>
 <button type="button" class="primary" onclick="publishPractice()">Опубликовать для группы</button></div>`;
}
function publishPractice(){
 const p=practices.find(x=>x.id===state.current);if(!p)return;
 p.mine=false;p.age="только что";
 state.tab="feed";setScreen("feed");
}

function profile(){
 const complete=!!(state.profileName&&state.profileName.trim()&&state.profileGroup&&state.profileGroup.trim());
 document.body.classList.toggle("profile-incomplete",!complete);
 if(state.profileEditing||!complete){
   return `${header("Профиль",true)}
   <div class="profileForm">
    <div class="field"><label>Имя</label><input id="profileName" value="${state.profileName||""}" placeholder="Как тебя зовут?" autocomplete="name"></div>
    <div class="field"><label>Группа</label><input id="profileGroup" value="${state.profileGroup==="нашей группой"?"":(state.profileGroup||"")}" placeholder="Например, Грузинский A2"></div>
    <div class="profileActions">
      ${complete?`<button type="button" class="secondary" onclick="cancelProfileEdit()">Отмена</button>`:""}
      <button type="button" class="primary" onclick="saveProfile()">Сохранить</button>
    </div>
   </div>
   <section class="aboutProduct"><h2>О продукте</h2><p>Здесь мы практикуем грузинский друг с другом: создаём небольшие задания, отвечаем сами и помогаем проверить ответы остальных. Без оценок — просто больше живой практики между занятиями.</p></section>`;
 }
 const groupText=state.profileGroup==="нашей группой"?"группой":`группой «${state.profileGroup}»`;
 return `${header("Профиль",true)}
 <div class="card practice profileCard" id="profileView"><div class="avatar">${state.profileName.trim()[0].toUpperCase()}</div><div><div class="title">${state.profileName}</div><div class="meta">Учусь вместе с ${groupText}</div></div><button type="button" class="profileEditBtn" onclick="editProfile()" aria-label="Редактировать профиль">${icons.edit}</button></div>
 <section class="aboutProduct"><h2>О продукте</h2><p>Здесь мы практикуем грузинский друг с другом: создаём небольшие задания, отвечаем сами и помогаем проверить ответы остальных. Без оценок — просто больше живой практики между занятиями.</p></section>`;
}
function editProfile(){state.profileEditing=true;render()}
function cancelProfileEdit(){state.profileEditing=false;render()}
function saveProfile(){
 const name=$("#profileName").value.trim(),group=$("#profileGroup").value.trim();
 if(!name||!group){
   if(!name)$("#profileName").focus(); else $("#profileGroup").focus();
   return;
 }
 state.profileName=name;state.profileGroup=group;state.profileEditing=false;
 render();
 const card=$("#profileView");if(card)card.classList.add("profileSaved");
}

function render(){
 const profileComplete=!!(state.profileName&&state.profileName.trim()&&state.profileGroup&&state.profileGroup.trim());
 document.body.classList.toggle("profile-incomplete",!profileComplete);
 let a=$("#app");
 if(state.screen==="feed")a.innerHTML=feed();
 else if(state.screen==="create")a.innerHTML=create();
 else if(state.screen==="practice")a.innerHTML=practice();
 else if(state.screen==="result")a.innerHTML=result();
 else if(state.screen==="profile")a.innerHTML=profile();
 else a.innerHTML=feed();
 bottom(["practice","result"].includes(state.screen)?"":state.screen);
 if(["practice","result"].includes(state.screen))$("#bottom").style.display="none";
}


let pagerGesture=null,pagerAnimating=false,suppressCardClick=false;

function syncTabButtons(){
 const tabs=document.querySelectorAll("#feedTabs button");
 tabs.forEach((b,i)=>b.classList.toggle("active",(state.tab==="feed"?0:1)===i));
}
function setPagerProgress(progress,animate=false){
 const track=$("#feedTrack"),indicator=$("#tabIndicator");
 if(!track||!indicator)return;
 track.classList.toggle("animating",animate);
 indicator.classList.toggle("animating",animate);
 track.style.transform=`translate3d(${-50*progress}%,0,0)`;
 indicator.style.transform=`translate3d(${100*progress}%,0,0)`;
 const pages=document.querySelectorAll(".feedPage");
 if(pages.length===2){
   pages[0].style.opacity=String(1-.04*progress);
   pages[1].style.opacity=String(.96+.04*progress);
 }
}
function switchFeedTab(tab){
 if(state.screen!=="feed"||pagerAnimating||tab===state.tab)return;
 const target=tab==="mine"?1:0;
 state.tab=tab; syncTabButtons(); pagerAnimating=true;
 setPagerProgress(target,true);
 setTimeout(()=>{pagerAnimating=false;},285);
}

document.addEventListener("touchstart",e=>{
 if(state.screen!=="feed"||pagerAnimating||e.touches.length!==1)return;
 if(e.target.closest("input,textarea,a,.tabs button,.nav,.iconbtn,.back,.topicChip,.countBtn,.countPreset,.primary,.secondary"))return;
 const p=e.touches[0];
 pagerGesture={x:p.clientX,y:p.clientY,lastX:p.clientX,lastT:performance.now(),vx:0,locked:null,start:state.tab==="mine"?1:0};
},{passive:true});

document.addEventListener("touchmove",e=>{
 if(!pagerGesture||state.screen!=="feed")return;
 const p=e.touches[0],dx=p.clientX-pagerGesture.x,dy=p.clientY-pagerGesture.y;
 if(pagerGesture.locked===null && (Math.abs(dx)>8||Math.abs(dy)>8))
   pagerGesture.locked=Math.abs(dx)>Math.abs(dy)*1.15?"x":"y";
 if(pagerGesture.locked!=="x")return;
 suppressCardClick=true;
 e.preventDefault();
 const now=performance.now(),dt=Math.max(1,now-pagerGesture.lastT);
 pagerGesture.vx=(p.clientX-pagerGesture.lastX)/dt;
 pagerGesture.lastX=p.clientX; pagerGesture.lastT=now;
 const w=Math.max(1,$("#feedPager").clientWidth);
 let progress=pagerGesture.start-dx/w;
 // Soft resistance at the outer edges.
 if(progress<0)progress=progress*.18;
 if(progress>1)progress=1+(progress-1)*.18;
 progress=Math.max(-.08,Math.min(1.08,progress));
 setPagerProgress(progress,false);
},{passive:false});


document.addEventListener("click",e=>{
 if(suppressCardClick && e.target.closest(".practiceCardButton")){
   e.preventDefault();e.stopPropagation();suppressCardClick=false;
 }
},true);

document.addEventListener("touchend",e=>{
 if(!pagerGesture||state.screen!=="feed"){pagerGesture=null;return}
 const g=pagerGesture; pagerGesture=null;
 if(g.locked!=="x"){setPagerProgress(g.start,true);return}
 const p=e.changedTouches[0],dx=p.clientX-g.x;
 const w=Math.max(1,$("#feedPager").clientWidth);
 const progress=g.start-dx/w;
 const fast=Math.abs(g.vx)>.45;
 let target;
 if(fast)target=g.vx<0?1:0;
 else target=progress>=.5?1:0;
 target=Math.max(0,Math.min(1,target));
 state.tab=target?"mine":"feed"; syncTabButtons();
 pagerAnimating=true; setPagerProgress(target,true);
 setTimeout(()=>{pagerAnimating=false;suppressCardClick=false;},285);
},{passive:true});

document.addEventListener("touchcancel",()=>{
 if(!pagerGesture)return;
 const start=pagerGesture.start; pagerGesture=null;
 setPagerProgress(start,true);
},{passive:true});

render();
</script>
</body>
</html>
